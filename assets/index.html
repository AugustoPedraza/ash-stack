<!DOCTYPE html>
<html lang="en" data-theme="corporate" data-preset="linear">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Inter font - premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <title>Dev Playground</title>

  <style>
    /* Prevent FOUC */
    html { visibility: hidden; }
    html.loaded { visibility: visible; }
  </style>
</head>
<body class="bg-base-100 text-base-content antialiased">
  <div id="app"></div>
  <script type="module" src="/svelte/playground.js"></script>
  <script>
    // Prevent flash of unstyled content
    document.documentElement.classList.add('loaded');
  </script>
</body>
</html>
